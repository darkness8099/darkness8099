name: Update Bomberman contribution graph

on:
  schedule:
    # 03:17 UTC = 12:17 Asia/Tokyo. GitHub schedules may run later under load.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcade.yml'

concurrency:
  group: arcade-output
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Generate Bomberman in light and dark themes
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: 'bomberman'
          hide_month_labels: 'false'

      - name: Verify both generated images
        shell: bash
        run: |
          test -s dist/bomberman-contribution-graph.svg
          test -s dist/bomberman-contribution-graph-dark.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ('dist/bomberman-contribution-graph.svg', 'dist/bomberman-contribution-graph-dark.svg'):
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              print(f'Valid SVG: {path}')
          PY

      - name: Publish images to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update Bomberman contribution graphs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
